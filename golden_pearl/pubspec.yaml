name: golden_pearl
description: "Golden Pearl - Luxury Fashion House"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  http_parser: ^4.0.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Generates iOS AppIcon.appiconset from assets/images/logo.png.
  # Run:  dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1
  # Generates native iOS launch screen from assets/images/logo.png.
  # Run:  dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay-Regular.ttf
        - asset: fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/PlayfairDisplay-Bold.ttf
          weight: 700

# iOS app icon generator config. Reads the existing logo only; writes
# into ios/Runner/Assets.xcassets/AppIcon.appiconset/. Android disabled
# so nothing else is touched.
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/app_icon.png"
  # iOS App Store rejects icons with alpha; flatten onto the cream brand bg.
  remove_alpha_ios: true
  background_color_ios: "#F4F4F4"

# iOS native splash generator config. Reads the existing logo only; writes
# into the Flutter-generated iOS launch storyboard and assets.
flutter_native_splash:
  color: "#F4F4F4"
  image: assets/images/logo.png
  color_dark: "#1C1C1C"
  image_dark: assets/images/logo.png
  android: false
  ios: true
  ios_content_mode: center
  fullscreen: false
